server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index remoteadmin.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9009; # Updated to port 9009
    }

    location ~ /\.ht {
        deny all;
    }
}
