# Trust all proxy sources (safe if only exposed via trusted proxy)
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Custom log format that includes both nginx-calculated and forwarded IPs
log_format full_log '$remote_addr ($http_x_forwarded_for) - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    access_log /dev/stdout full_log;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index remoteadmin.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php-fpm.sock; # Updated socket path
    }

    location ~ /\.ht {
        deny all;
    }
}
